name: Build CF IP Pool

on:
  schedule:
    # 每 6 小时跑一次。注意：GitHub cron 走 UTC，不能写 +08:00。
    # 这里 0/6/12/18 UTC = 北京 08:00 / 14:00 / 20:00 / 次日 02:00
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      sample:
        description: '每 /24 取样数(留空用 config.json 里的值)'
        required: false
        default: ''
      ports:
        description: '端口(逗号分隔，留空用 config.json 里的值)'
        required: false
        default: ''
      workers:
        description: '并发数(留空用 config.json 里的值)'
        required: false
        default: ''
      target:
        description: '目标存活条数(留空用 config.json 里的值)'
        required: false
        default: ''
      timeout:
        description: 'TCP 超时秒数(留空用 config.json 里的值)'
        required: false
        default: ''
      no_header:
        description: '填 true 则 ipv4.txt 不写 # 注释头(纯 IP:端口)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # ── 1. 拉代码 ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v6

      # ── 2. 装 Python 3.11 ──────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # ── 3. 没有 config.json 就生成模板（有就沿用，方便仓库里改配置）──
      - name: Init config from template
        run: |
          if [ ! -f config.json ]; then
            python scripts/build_pool.py --init-config
          fi
          cat config.json

      # ── 4. 正式构建 IP 池（核心步骤）──────────────────────────
      # 手动触发时，填了的输入项会拼成 --xxx 覆盖 config.json；留空则用配置值
      - name: Build IP pool
        env:
          # 强制流/日志用 UTF-8，避免 GH runner 的 C locale 下中文日志报错
          PYTHONIOENCODING: utf-8
        run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.sample }}" ];  then EXTRA="$EXTRA --sample ${{ github.event.inputs.sample }}"; fi
          if [ -n "${{ github.event.inputs.ports }}" ];   then EXTRA="$EXTRA --ports ${{ github.event.inputs.ports }}"; fi
          if [ -n "${{ github.event.inputs.workers }}" ]; then EXTRA="$EXTRA --workers ${{ github.event.inputs.workers }}"; fi
          if [ -n "${{ github.event.inputs.target }}" ];  then EXTRA="$EXTRA --target ${{ github.event.inputs.target }}"; fi
          if [ -n "${{ github.event.inputs.timeout }}" ]; then EXTRA="$EXTRA --timeout ${{ github.event.inputs.timeout }}"; fi
          if [ "${{ github.event.inputs.no_header }}" = "true" ]; then EXTRA="$EXTRA --no-header"; fi

          # 清掉历史遗留的断点状态文件：它会让每次运行跳过所有已探 IP，最终产出 0 条
          rm -f output/pool_state.json

          python scripts/build_pool.py --config config.json $EXTRA

      # ── 5. 打印摘要，方便在 Actions 日志里直接看结果 ──────────
      - name: Show summary
        run: |
          echo "=== ipv4.txt 行数 ==="
          wc -l output/ipv4.txt || true
          echo "=== 前 10 行 ==="
          head -n 10 output/ipv4.txt || true
          echo "=== meta.json ==="
          cat output/meta.json || true

      # ── 6. 自动提交回仓库（用 Actions 机器人身份，无需 token）──
      # 只在 output/ 有变化时才提交，避免空 commit 刷历史
      # 时间戳统一用北京时间（UTC+8），commit message 和 meta.json 保持一致
      - name: Commit results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "no changes"
          else
            STAMP="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
            git commit -m "chore: update CF IP pool ${STAMP} UTC+8"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            git push origin HEAD:${{ github.ref_name }}
            echo "PUSHED: output/ committed to ${{ github.repository }} @ ${{ github.ref_name }} at ${STAMP} UTC+8"
          fi
